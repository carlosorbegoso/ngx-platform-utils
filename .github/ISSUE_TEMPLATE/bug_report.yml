name: Bug report
description: Report a problem with ngx-platform-utils
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please fill in the details below.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps, code snippet, or a minimal reproduction link.
      placeholder: |
        1. Inject `...Service`
        2. Read `...()`
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: lib-version
    attributes:
      label: ngx-platform-utils version
      placeholder: e.g. 2.0.1
    validations:
      required: true
  - type: input
    id: angular-version
    attributes:
      label: Angular version
      placeholder: e.g. 22.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser / OS, and whether SSR is involved.
      placeholder: e.g. Chrome 130 on macOS, SSR enabled
    validations:
      required: false
